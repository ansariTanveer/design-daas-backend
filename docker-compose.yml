version: '3.9'
services:

    #
    # Dev services
    #
    mariadb-dev:
        profiles:
            - dev-environment
            - release-test-environment
        user: ${HOST_USER_UID:?}:${HOST_USER_GID:?}
        image: ${COMPOSE_PROJECT_NAME:?}-mariadb:latest
        volumes:
            - ./var/database/mariadb/:/data/
            - type: tmpfs
              target: /var/lib/mysql/
        env_file:
            - ./var/generated-configs/mariadb-dev.env
            - ./var/mariadb-dev.override.env
        ports:
            - ${MARIADB_DEV_HOST_PORT:?}:3306
        ulimits:
            nproc: 65535
            nofile:
                soft: 65535
                hard: 65535
    mariadb-test:
        profiles:
            - dev-environment
        user: ${HOST_USER_UID:?}:${HOST_USER_GID:?}
        image: ${COMPOSE_PROJECT_NAME:?}-mariadb:latest
        tmpfs:
            - /data/:uid=${HOST_USER_UID:?},gid=${HOST_USER_GID:?}
        volumes:
            - type: tmpfs
              target: /var/lib/mysql/
        env_file:
            - ./var/generated-configs/mariadb-test.env
            - ./var/mariadb-test.override.env
        ports:
            - ${MARIADB_TEST_HOST_PORT:?}:3306
        ulimits:
            nproc: 65535
            nofile:
                soft: 65535
                hard: 65535
    migrations-dev:
        profiles:
            - dev-environment
        user: ${HOST_USER_UID:?}:${HOST_USER_GID:?}
        image: ${COMPOSE_PROJECT_NAME:?}-php:latest
        command: docker-migrations
        volumes:
            - ./:/project/
        env_file:
            - ./var/generated-configs/application.env
            - ./var/application.override.env
        environment:
            - APPLICATION_LOG_FILE=/project/var/log/application.log
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            mariadb-dev:
                condition: service_healthy
    apache-dev:
        profiles:
            - dev-environment
        user: ${HOST_USER_UID:?}:${HOST_USER_GID:?}
        image: ${COMPOSE_PROJECT_NAME:?}-php:latest
        volumes:
            - ./:/project/
        env_file:
            - ./var/generated-configs/application.env
            - ./var/application.override.env
        environment:
            - APPLICATION_LOG_FILE=/project/var/log/application.log
        extra_hosts:
            - "host.docker.internal:host-gateway"
        ports:
            - ${APACHE_HOST_PORT:?}:80
        depends_on:
            mariadb-dev:
                condition: service_healthy
    cron-dev:
        profiles:
            - dev-environment
        user: ${HOST_USER_UID:?}:${HOST_USER_GID:?}
        image: ${COMPOSE_PROJECT_NAME:?}-php:latest
        command: docker-cron
        volumes:
            - ./:/project/
        env_file:
            - ./var/generated-configs/application.env
            - ./var/application.override.env
        environment:
            - APPLICATION_LOG_FILE=/project/var/log/application.log
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            mariadb-dev:
                condition: service_healthy
    mail-queue-dev:
        profiles:
            - dev-environment
        user: ${HOST_USER_UID:?}:${HOST_USER_GID:?}
        image: ${COMPOSE_PROJECT_NAME:?}-php:latest
        command: docker-mail-queue
        volumes:
            - ./:/project/
        env_file:
            - ./var/generated-configs/application.env
            - ./var/application.override.env
        environment:
            - MEDIA_STORAGE_DIR=${MEDIA_STORAGE_DIR:-/project/var/storage/}
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            mariadb-dev:
                condition: service_healthy

    #
    # Release test services
    #
    migrations-release-test:
        profiles:
            - release-test-environment
        user: ${HOST_USER_UID:?}:${HOST_USER_GID:?}
        image: ${COMPOSE_PROJECT_NAME:?}-release:latest
        command: docker-migrations
        volumes:
            - ./var/:/project/var/
        env_file:
            - ./var/generated-configs/application.env
            - ./var/application.override.env
        depends_on:
            mariadb-dev:
                condition: service_healthy
    apache-release-test:
        profiles:
            - release-test-environment
        user: ${HOST_USER_UID:?}:${HOST_USER_GID:?}
        image: ${COMPOSE_PROJECT_NAME:?}-release:latest
        volumes:
            - ./var/:/project/var/
        env_file:
            - ./var/generated-configs/application.env
            - ./var/application.override.env
        ports:
            - ${APACHE_HOST_PORT:?}:80
        depends_on:
            migrations-release-test:
                condition: service_completed_successfully
            mariadb-dev:
                condition: service_healthy
    cron-release-test:
        profiles:
            - release-test-environment
        user: ${HOST_USER_UID:?}:${HOST_USER_GID:?}
        image: ${COMPOSE_PROJECT_NAME:?}-release:latest
        command: docker-cron
        volumes:
            - ./var/:/project/var/
        env_file:
            - ./var/generated-configs/application.env
            - ./var/application.override.env
        depends_on:
            migrations-release-test:
                condition: service_completed_successfully
            mariadb-dev:
                condition: service_healthy
    mail-queue-release-test:
        profiles:
            - release-test-environment
        user: ${HOST_USER_UID:?}:${HOST_USER_GID:?}
        image: ${COMPOSE_PROJECT_NAME:?}-php:latest
        command: docker-mail-queue
        volumes:
            - ./:/project/
        env_file:
            - ./var/generated-configs/application.env
            - ./var/application.override.env
        environment:
            - MEDIA_STORAGE_DIR=${MEDIA_STORAGE_DIR:-/project/var/storage/}
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            mariadb-dev:
                condition: service_healthy

    #
    # Tool services
    #
    tools:
        profiles:
            - tools
        user: ${HOST_USER_UID:?}:${HOST_USER_GID:?}
        image: ${COMPOSE_PROJECT_NAME:?}-php:latest
        command: /bin/false
        volumes:
            - /etc/passwd:/etc/passwd
            - /etc/group:/etc/group
            - ./:/project/
        env_file:
            - ./var/generated-configs/application.env
            - ./var/application.override.env
        environment:
            - XDEBUG_TRIGGER
            - XDEBUG_SESSION
            - XDEBUG_PROFILE
            - XDEBUG_TRACE
            - APPLICATION_LOG_FILE=/project/var/log/application.log
            - TEST_DATABASE_DSN=mysql://${MARIADB_TEST_USER:?}:${MARIADB_TEST_PASSWORD:?}@mariadb-test:3306/${MARIADB_TEST_DATABASE:?}
        extra_hosts:
            - "host.docker.internal:host-gateway"
    shell:
        profiles:
            - tools
        user: ${HOST_USER_UID:?}:${HOST_USER_GID:?}
        image: ${COMPOSE_PROJECT_NAME:?}-php:latest
        entrypoint: docker-php-entrypoint
        command: bash
        volumes:
            - /etc/passwd:/etc/passwd
            - /etc/group:/etc/group
            - ./:/project/
        env_file:
            - ./.env
        environment:
            - XDEBUG_TRIGGER
            - XDEBUG_SESSION
            - XDEBUG_PROFILE
            - XDEBUG_TRACE
        extra_hosts:
            - "host.docker.internal:host-gateway"
